# Pages CMS configuration: defines the editing screens at https://app.pagescms.org
media:
  input: media
  output: /media
  categories: [image]

content:
  - name: entries
    label: Entries
    type: collection
    path: entries
    filename: "{primary}.md"
    format: yaml-frontmatter
    exclude: [README.md]
    view:
      fields: [title, type, top_tag]
      primary: title
      sort: [title]
      search: [title, tags, body]
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: A short, plain-English headline.
      - name: type
        label: Type of entry
        type: select
        required: true
        description: "Explainer: background on a topic. Learning: something we found out. Issue: a problem."
        options:
          values: [Explainer, Learning, Issue]
      - name: top_tag
        label: Top tag
        type: reference
        required: true
        description: The branch this entry sits under on the map. New top tags are added under "Top tags" in the menu.
        options:
          collection: topics
          value: "{name}"
          label: "{name}"
          search: name
      - name: body
        label: Text
        type: rich-text
        description: Start with a one-paragraph summary. It's shown on the map and in search. Add as much detail below it as you like.
      - name: tags
        label: Tags
        type: string
        list: true
        description: Keywords people might search for. Optional.
      - name: related
        label: Related entries
        type: reference
        description: Other entries worth reading alongside this one. Optional.
        options:
          collection: entries
          multiple: true
          value: "{title}"
          label: "{title}"
          search: title
      - name: status
        label: Status (issues only)
        type: select
        description: Leave blank for explainers and learnings.
        options:
          values: [Open, Resolved]
      - name: contributors
        label: Contributors
        type: string
        list: true
      - name: image
        label: Image
        type: image
        description: Optional picture shown at the top of the entry.

  - name: topics
    label: Top tags
    type: collection
    path: topics
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [name]
      primary: name
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: description
        label: Description
        type: text
        description: One sentence about what belongs under this top tag. Optional.
